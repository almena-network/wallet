[package]
name = "wallet"
version = "0.1.0"
description = "Almena Wallet"
authors = ["Almena Network"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
# Turning down the second window an iPad offers — see `scene.rs`. The same
# `objc2-ui-kit` Tauri itself is built on, with only the pieces that ask the
# application to destroy a scene session.
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "UIApplication",
    "UIScene",
    "UISceneSession",
    "UISceneOptions",
    "block2",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
